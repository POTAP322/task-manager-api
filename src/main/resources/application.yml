spring:
  application:
    name: task-manager-api
  datasource:
    url: jdbc:postgresql://localhost:5433/taskmanager
    username: taskmanager
    password: taskmanager
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-in-prod-0123456789}
    expiration: 60m